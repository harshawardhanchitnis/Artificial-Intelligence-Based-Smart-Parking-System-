[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-parking-backend"
version = "0.1.0"
description = "Offline smart-parking FastAPI backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "numpy==2.5.2",
  "pillow==12.3.0",
  "pydantic-settings==2.15.0",
  "scikit-learn==1.9.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
